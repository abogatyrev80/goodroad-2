name: Build & Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
      - "scripts/host_maintenance.py"
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to deploy (short or full). Leave empty to build & deploy HEAD."
        required: false
        default: ""

env:
  IMAGE: abogatyrev80/goodroad

permissions:
  contents: read

concurrency:
  group: goodroad-production-host
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # Skip build when rolling back to an existing image
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.sha == ''
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve short SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    # Run after build (normal push) or directly (rollback dispatch)
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.sha != ''))
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target SHA
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${REQUESTED_SHA:-$BUILT_SHA}"
          [[ "$SHA" =~ ^[0-9a-fA-F]{7,40}$ ]] || { echo 'Invalid Git SHA'; exit 1; }
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare private host script directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            test ! -L /dev/shm/goodroad-maintenance
            if [ ! -e /dev/shm/goodroad-maintenance ]; then
              mkdir -m 700 /dev/shm/goodroad-maintenance
            fi
            test -d /dev/shm/goodroad-maintenance
            test "$(stat -c '%u:%a' /dev/shm/goodroad-maintenance)" = 0:700

      - name: Copy host maintenance script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: scripts/host_maintenance.py
          target: /dev/shm/goodroad-maintenance
          strip_components: 1
          tar_tmp_path: /dev/shm/goodroad-maintenance
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ steps.target.outputs.sha }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA,IMAGE
          command_timeout: 10m
          script: |
            set -eu
            case "$SHA" in ''|*[!0-9a-fA-F]*) echo 'Invalid Git SHA'; exit 1 ;; esac
            [ "${#SHA}" -ge 7 ] && [ "${#SHA}" -le 40 ]
            [ "$IMAGE" = abogatyrev80/goodroad ]
            cd /opt/goodroad

            echo "Deploying $IMAGE:$SHA"

            docker pull "$IMAGE:$SHA"

            sed -i "s|image: $IMAGE:.*|image: $IMAGE:$SHA|" /opt/goodroad/docker-compose.yaml

            python3 /dev/shm/goodroad-maintenance/host_maintenance.py write-rotation
            docker compose -f /opt/goodroad/docker-compose.yaml -f /opt/goodroad/docker-compose.logging.yaml up -d --force-recreate --no-deps --no-build backend
            python3 /dev/shm/goodroad-maintenance/host_maintenance.py wait-ready
            echo "Deployment ready: $IMAGE:$SHA"
