name: Recover MongoDB

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        required: true
        default: full
        options:
          - full
          - status-only
          - fix-network
          - restart-mongo
          - restart-backend

env:
  IMAGE: abogatyrev80/goodroad

jobs:
  recover:
    name: Diagnose & Recover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            ACTION="${{ github.event.inputs.action }}"

            echo "===== DISK ====="
            df -h

            echo "===== DOCKER CONTAINERS ====="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

            echo "===== COMPOSE SERVICES ====="
            cd /opt/goodroad
            docker compose ps -a || true

            echo "===== NETWORKS OF CONTAINERS ====="
            echo -n "backend:  "; docker inspect road-monitor-backend --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null || echo "n/a"
            echo -n "mongodb:  "; docker inspect road-monitor-mongodb --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null || echo "n/a"

            echo "===== BACKEND ENV (MONGO*) ====="
            docker inspect road-monitor-backend --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -i -E 'mongo|url' || echo "n/a"

            echo "===== NETWORK LS ====="
            docker network ls

            if [ "$ACTION" = "status-only" ]; then
              exit 0
            fi

            if [ "$ACTION" = "restart-mongo" ]; then
              echo "===== RESTART MONGODB ====="
              docker compose up -d --force-recreate mongodb
              sleep 10
            fi

            if [ "$ACTION" = "restart-backend" ]; then
              echo "===== RESTART BACKEND ====="
              docker compose up -d --force-recreate --no-deps backend
            fi

            if [ "$ACTION" = "fix-network" ] || [ "$ACTION" = "full" ]; then
              echo "===== RECREATING MONGODB + BACKEND (same compose network) ====="
              docker compose up -d --force-recreate mongodb backend
              echo "===== WAITING 15s FOR MONGO TO ACCEPT CONNECTIONS ====="
              sleep 15
            fi

            if [ "$ACTION" = "full" ]; then
              echo "===== WAITING FOR READY ====="
              for i in $(seq 1 60); do
                if docker compose exec -T backend python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')" 2>/dev/null; then
                  echo "Backend ready after ${i}s"
                  break
                fi
                if [ $i -eq 60 ]; then
                  echo "Backend not ready after 120s"
                  docker compose logs backend --tail=80
                  exit 1
                fi
                sleep 2
              done

              echo "===== FINAL NETWORKS ====="
              echo -n "backend:  "; docker inspect road-monitor-backend --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
              echo -n "mongodb:  "; docker inspect road-monitor-mongodb --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'

              echo "===== HEALTH ====="
              docker compose exec -T backend python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8001/health').read().decode())" || true
              docker compose exec -T backend python3 -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8001/ready').read().decode())" || true
            fi

            echo "===== FINAL STATUS ====="
            docker ps --format 'table {{.Names}}\t{{.Status}}'
